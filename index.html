<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ONG Esperança Viva — aplicação dinâmica e acessível para cadastro e divulgação de projetos sociais.">
  <title>ONG Esperança Viva | Inclusão e Acessibilidade</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Metadados de acessibilidade e SEO -->
  <meta name="theme-color" content="#0055a5">
  <meta name="author" content="ONG Esperança Viva">
</head>

<body>
  <!-- Atalho de teclado para pular para o conteúdo principal -->
  <a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>

  <!-- Barra de ferramentas de acessibilidade -->
  <div id="accessibility-toolbar" role="region" aria-label="Ferramentas de acessibilidade">
    <button id="toggle-dark" aria-pressed="false">🌙 Modo Escuro</button>
    <button id="toggle-contrast" aria-pressed="false">🌓 Alto Contraste</button>
  </div>

  <!-- Menu mobile acessível -->
  <div class="menu-toggle" aria-label="Abrir menu de navegação" role="button" tabindex="0">
    <span></span><span></span><span></span>
  </div>
  
  <header>
    <h1 tabindex="0">ONG Esperança Viva</h1>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="#/" tabindex="0">Início</a></li>
        <li><a href="#projetos" tabindex="0">Projetos</a></li>
        <li><a href="#cadastro" tabindex="0">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" role="main" tabindex="-1">
    <div id="content" aria-live="polite"></div>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2025 ONG Esperança Viva — Todos os direitos reservados.</p>
  </footer>
    
  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
  <script src="js/accessibility.js"></script>
</body>
</html>
<!-- Ajuste de acessibilidade testado -->
